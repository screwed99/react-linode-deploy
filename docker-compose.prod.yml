version: '3'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: zilt-be
    env_file: .env.prod
    restart: unless-stopped
    networks:
      - caddy_net

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zilt-fe
    env_file: .env.prod
    restart: unless-stopped
    networks:
      - caddy_net

networks:
  caddy_net:
    external: true